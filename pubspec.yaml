name: quran_app
description: Application Coran, horaires de salat et mosquées à proximité.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  intl: ^0.20.2
  audioplayers: ^6.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  flutter_compass: ^0.8.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_localizations:
    sdk: flutter
  hijri: ^3.0.0
  flutter_local_notifications: 17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#FAF6EE"
  color_dark: "#0B1615"
  image: assets/images/logo_noor_quran.png
  image_dark: assets/images/logo_noor_quran.png
  android_12:
    image: assets/images/logo_noor_quran.png
    icon_background_color: "#FAF6EE"
    image_dark: assets/images/logo_noor_quran.png
    icon_background_color_dark: "#0B1615"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
